name: Release

# Push a vX.Y.Z tag (or run manually via workflow_dispatch, e.g. to re-publish a build) to produce
# a GitHub Release carrying SolScan-Setup-<version>.exe, with the release notes pulled straight
# from the matching "## vX.Y.Z" section of ReleaseNotes.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# softprops/action-gh-release needs write access to create the release and upload assets using
# the workflow's default GITHUB_TOKEN - no separate PAT needed for that part.
permissions:
  contents: write

jobs:
  release:
    # A regular GitHub-hosted runner - no self-hosted machine to register or keep online. This
    # only works because the vendor camera SDK DLLs (ASICamera2.dll/altaircam.dll) live in the
    # SolScan.External git submodule rather than needing to already be sitting on whichever
    # machine builds the release (see SolScan.External's own README.md, and CLAUDE.md's
    # comparison against N.I.N.A.'s own nina.external submodule, for why). Checking that private
    # submodule out here still needs its own credential, though - the default GITHUB_TOKEN only
    # has access to this repo, not SolScan.External - so this requires a one-time setup step:
    # a fine-grained Personal Access Token with "Contents: Read" on JPhilC/SolScan.External only,
    # saved as this repo's SOLSCAN_EXTERNAL_PAT secret (Settings > Secrets and variables >
    # Actions). Until that secret exists, submodule checkout below will fail with a 404/auth
    # error rather than silently producing a build with no camera support.
    runs-on: windows-latest

    steps:
      - name: Checkout (with SolScan.External submodule)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SOLSCAN_EXTERNAL_PAT }}
          submodules: recursive
          lfs: true

      - name: Verify tag matches Directory.Build.props version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $propsContent = Get-Content -Raw Directory.Build.props
          if ($propsContent -notmatch '<Version>\s*([^<\s]+)\s*</Version>') {
            throw "Could not find <Version> in Directory.Build.props"
          }
          $propsVersion = $Matches[1]
          if ($tagVersion -ne $propsVersion) {
            throw "Tag v$tagVersion does not match Directory.Build.props <Version>$propsVersion</Version> - bump the version and re-tag."
          }
          Write-Host "Tag v$tagVersion matches Directory.Build.props." -ForegroundColor Green

      - name: Check for vendor camera SDK DLLs
        shell: pwsh
        run: |
          $vendorDlls = @{
            "ASICamera2.dll" = "SolScan.External\x64\ASI\ASICamera2.dll"
            "altaircam.dll"  = "SolScan.External\x64\Altair\altaircam.dll"
          }
          foreach ($dll in $vendorDlls.Keys) {
            if (-not (Test-Path $vendorDlls[$dll])) {
              Write-Host "::warning::$dll is not present in $($vendorDlls[$dll]) - the built installer will NOT include real-hardware support for that camera vendor. See SolScan.External\README.md."
            }
          }

      - name: Build installer
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Force

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $propsContent = Get-Content -Raw Directory.Build.props
          $null = $propsContent -match '<Version>\s*([^<\s]+)\s*</Version>'
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Extract release notes for this version
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content ReleaseNotes.md
          $start = $null
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## v$([regex]::Escape($version))\b") {
              $start = $i
            } elseif ($null -ne $start -and $lines[$i] -match '^## v') {
              $end = $i
              break
            }
          }
          if ($null -eq $start) {
            throw "No '## v$version' section found in ReleaseNotes.md - add one before tagging a release."
          }
          $section = $lines[($start + 1)..($end - 1)] -join "`n"
          $notesPath = "release-notes-extract.md"
          Set-Content -Path $notesPath -Value $section
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SolScan v${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: Releases/SolScan-Setup-${{ steps.version.outputs.version }}.exe
